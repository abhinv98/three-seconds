[project]
name = "three-seconds-worker"
version = "0.1.0"
description = "Analysis worker for Three Seconds. Visual pipeline (frames, Muse Spark Open, label track, checks); audio not yet."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
