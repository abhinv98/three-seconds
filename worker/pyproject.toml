[project]
name = "three-seconds-worker"
version = "0.1.0"
description = "Analysis worker for Three Seconds: frames read by Muse Spark Open, audio by Muse Voice Transcribe, ASCI checks."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Vercel (FastAPI): runs after the dependencies are installed, before the function is bundled.
[tool.vercel.scripts]
build = "python build.py"
